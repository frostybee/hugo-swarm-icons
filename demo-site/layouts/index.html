<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ site.Title }}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
    section { display: flex; align-items: center; gap: 1rem; padding: .5rem 0; border-bottom: 1px solid #ddd; }
    section code { margin-left: auto; color: #666; font-size: .8rem; }
  </style>
</head>
<body>
<h1>{{ site.Title }}</h1>
<p>Each row renders one entry from <code>data/test_cases.yaml</code>.</p>
{{ range site.Data.test_cases }}
<section>
  {{ partial "swarm-icon/icon.html" .params }}
  <strong>{{ .label }}</strong>
  <code>{{ jsonify .params }}</code>
</section>
{{ end }}
</body>
</html>
