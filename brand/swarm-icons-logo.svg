    <rect x="-5" y="-8" width="3.5" height="16" rx="1" fill="#071e26" opacity="0.7"/>
    <rect x="2" y="-8" width="3.5" height="16" rx="1" fill="#071e26" opacity="0.7"/>
    <ellipse cx="-6" cy="-7" rx="7" ry="4.5" fill="white" opacity="0.6" transform="rotate(-25)"/>
